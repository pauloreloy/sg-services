name: sharegrant

services:
  localstack:
    image: localstack/localstack:3.8
    container_name: sg-localstack
    ports:
      - "4566:4566" # LocalStack Gateway (all mocked AWS services)
    environment:
      - SERVICES=sqs,dynamodb
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      # Variables consumed by scripts/init-localstack.sh (resource names).
      - SQS_SOURCE_QUEUE_NAME=sg-share-queue
      - SQS_SUCCESS_QUEUE_NAME=sg-share-success-queue
      - SQS_FAILURE_QUEUE_NAME=sg-share-failure-queue
      - DYNAMODB_TABLE_NAME=sg-share-processing-records
      - DYNAMODB_GRANT_ID_INDEX_NAME=grant_id-processed_at-index
    volumes:
      # Init hook: LocalStack runs every script under ready.d/ once it is up,
      # automatically creating the SQS queues and the DynamoDB table (+ GSI).
      - ./scripts/init-localstack.sh:/etc/localstack/init/ready.d/init-localstack.sh
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  sqs-consumer:
    build:
      context: ./services/sqs-consumer
      dockerfile: Dockerfile
    container_name: sg-sqs-consumer
    ports:
      - "8000:8000"
    environment:
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_ENDPOINT_URL=http://localstack:4566
      - SQS_SOURCE_QUEUE_NAME=sg-share-queue
      - SQS_SUCCESS_QUEUE_NAME=sg-share-success-queue
      - SQS_FAILURE_QUEUE_NAME=sg-share-failure-queue
      - DYNAMODB_TABLE_NAME=sg-share-processing-records
      - LOG_LEVEL=INFO
    depends_on:
      localstack:
        condition: service_healthy
    restart: unless-stopped

  checkstep-service:
    build:
      context: ./services/checkstep-service
      dockerfile: Dockerfile
    container_name: sg-checkstep-service
    ports:
      # Exposed on host port 80 -> container listens internally on 8080 as a
      # non-root user (binding to port 80 requires root, which we avoid).
      - "80:8080"
    environment:
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_ENDPOINT_URL=http://localstack:4566
      - DYNAMODB_TABLE_NAME=sg-share-processing-records
      - DYNAMODB_GRANT_ID_INDEX_NAME=grant_id-processed_at-index
      - LOG_LEVEL=INFO
    depends_on:
      localstack:
        condition: service_healthy
    restart: unless-stopped

volumes:
  localstack-data:
