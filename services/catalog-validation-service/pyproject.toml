[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "sharegrant-catalog-validation-service"
version = "0.1.0"
description = "Microservice validating catalog in data governance choreography"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "boto3>=1.35.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
